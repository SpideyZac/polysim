[package]
name = "polysim"
version = "1.0.0"
edition = "2024"
description = "Headless PolyTrack physics simulation: deterministic multi-car WASM engine wrapper"
license = "Apache-2.0"
repository = "https://github.com/SpideyZac/polysim"
readme = "README.md"
keywords = ["polytrack", "simulation", "physics", "wasm", "gamedev"]
categories = ["game-development", "simulation", "wasm"]
exclude = ["target/", "*.wasm"]

[lib]
name = "polysim"
path = "src/lib.rs"

[[bench]]
name = "sim"
harness = false

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
parry3d = "0.30.0"
polytrack-codes = "0.3"
thiserror = "2.0.19"
wasmtime = "47.0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
